name: publish

# Publishing needs authentication, configured once for the package on npmjs.com:
#   * Trusted Publishing (recommended — no secret): package → Settings →
#     Trusted Publisher → GitHub Actions, repository `lizhijie429/dsh-root-temp-guard`,
#     workflow `publish.yml`. The OIDC token granted below then authenticates the run.
#   * or a granular access token with publish rights stored as the NPM_TOKEN
#     secret; then add `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` to the publish step.
#
# The tag is authoritative: `package.json` version must equal the tag without its
# leading `v`, and the release gate (tests + real packed file list) must pass.
# The plugin-market index (`docs/index.json`) is generated before the tag, by
# `npm run market:index`, and is not part of this workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Release gate (tests + packed file list)
        run: npm run verify
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const p = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (tag !== p.version) { console.error('tag ' + tag + ' does not match package.json ' + p.version); process.exit(1) } console.log('tag ' + tag + ' matches package.json')"
      - name: Publish to npm
        run: npm publish --provenance --access public
